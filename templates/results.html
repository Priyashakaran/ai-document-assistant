
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summary Results - AI PDF Summarizer</title>


    <style>

        /* -----------------------------------------
           General page styling
        ----------------------------------------- */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f6f8;

            color: #17243a;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* -----------------------------------------
           Main application container
        ----------------------------------------- */

        .container {

            width: 100%;

            max-width: 850px;

            background: #ffffff;

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 15px 40px rgba(12, 31, 58, 0.15);

            border: 1px solid #d9dee7;
        }


        /* -----------------------------------------
           Header
        ----------------------------------------- */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            border-radius: 16px;

            background: #b51f2a;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 32px;

            box-shadow:
                0 6px 15px rgba(181, 31, 42, 0.25);
        }


        h1 {

            margin: 0;

            font-size: 34px;

            color: #102a4c;
        }


        .subtitle {

            margin-top: 12px;

            color: #596575;

            font-size: 16px;

            line-height: 1.6;
        }


        /* -----------------------------------------
           Result section
        ----------------------------------------- */

        .result-section {

            margin-top: 25px;

            padding: 30px;

            border-radius: 14px;

            background: #f3f6fa;

            border-left: 5px solid #102a4c;

            border-top: 1px solid #d9dee7;

            border-right: 1px solid #d9dee7;

            border-bottom: 1px solid #d9dee7;
        }


        /* -----------------------------------------
           Result heading
        ----------------------------------------- */

        .result-heading {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

            color: #102a4c;

            font-size: 21px;

            font-weight: bold;
        }


        .result-heading-icon {

            font-size: 23px;
        }


        /* -----------------------------------------
           Summary text
        ----------------------------------------- */

        .summary-text {

            color: #344258;

            font-size: 16px;

            line-height: 1.8;

            white-space: pre-wrap;
        }


        /* -----------------------------------------
           Button section
        ----------------------------------------- */

        .button-container {

            text-align: center;

            margin-top: 30px;
        }


        .button {

            display: inline-block;

            text-decoration: none;

            border: none;

            border-radius: 8px;

            padding: 14px 30px;

            background: #b51f2a;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 5px 12px rgba(181, 31, 42, 0.20);
        }


        .button:hover {

            background: #8f1620;

            transform: translateY(-1px);
        }


        /* -----------------------------------------
           Footer
        ----------------------------------------- */

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #7a8492;

            font-size: 13px;
        }


        /* -----------------------------------------
           Responsive design
        ----------------------------------------- */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .container {

                padding: 28px 20px;

                border-radius: 15px;
            }


            h1 {

                font-size: 27px;
            }


            .result-section {

                padding: 22px 18px;
            }


            .summary-text {

                font-size: 15px;

                line-height: 1.7;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- ---------------------------------------
             Header
        ---------------------------------------- -->

        <div class="header">

            <div class="icon">
                📄
            </div>


            <h1>
                AI PDF Summarizer
            </h1>


            <p class="subtitle">
                Your document has been successfully summarized.
            </p>

        </div>


        <!-- ---------------------------------------
             Summary result
        ---------------------------------------- -->

        <div class="result-section">


            <div class="result-heading">

                <span class="result-heading-icon">
                    📝
                </span>

                <span>
                    Generated Summary
                </span>

            </div>


            <div class="summary-text">

                {{ summary }}

            </div>


        </div>


        <!-- ---------------------------------------
             Upload another PDF button
        ---------------------------------------- -->

        <div class="button-container">

            <a
                href="/"
                class="button"
            >
                ← Upload Another PDF
            </a>

        </div>


        <!-- ---------------------------------------
             Footer
        ---------------------------------------- -->

        <div class="footer">

            Powered by Flask, Hugging Face Transformers
            &amp; BART

        </div>


    </div>


</body>

</html>
