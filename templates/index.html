<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI PDF Summarizer</title>


    <style>

        /* -----------------------------------------
           General page styling
        ----------------------------------------- */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f6f8;

            color: #17243a;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* -----------------------------------------
           Main application container
        ----------------------------------------- */

        .container {

            width: 100%;

            max-width: 850px;

            background: #ffffff;

            border-radius: 18px;

            padding: 45px;

            box-shadow:
                0 15px 40px rgba(12, 31, 58, 0.15);

            border: 1px solid #d9dee7;
        }


        /* -----------------------------------------
           Header
        ----------------------------------------- */

        .header {

            text-align: center;

            margin-bottom: 35px;
        }


        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            border-radius: 16px;

            background: #b51f2a;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 32px;

            box-shadow:
                0 6px 15px rgba(181, 31, 42, 0.25);
        }


        h1 {

            margin: 0;

            font-size: 34px;

            color: #102a4c;
        }


        .subtitle {

            margin-top: 12px;

            color: #596575;

            font-size: 16px;

            line-height: 1.6;
        }


        /* -----------------------------------------
           Upload section
        ----------------------------------------- */

        .upload-box {

            border: 2px dashed #b51f2a;

            background: #fffafb;

            border-radius: 14px;

            padding: 35px;

            text-align: center;

            transition: 0.2s;
        }


        .upload-box:hover {

            background: #fff5f6;

            border-color: #8f1620;
        }


        .upload-title {

            font-size: 19px;

            font-weight: bold;

            color: #102a4c;

            margin-bottom: 8px;
        }


        .upload-description {

            color: #687384;

            font-size: 14px;

            margin-bottom: 22px;
        }


        /* -----------------------------------------
           File input
        ----------------------------------------- */

        input[type="file"] {

            width: 100%;

            max-width: 500px;

            padding: 12px;

            border: 1px solid #c8ced8;

            border-radius: 8px;

            background: #ffffff;

            color: #344258;

            cursor: pointer;
        }


        /* -----------------------------------------
           Button
        ----------------------------------------- */

        .button-container {

            text-align: center;

            margin-top: 25px;
        }


        button {

            border: none;

            border-radius: 8px;

            padding: 14px 30px;

            background: #b51f2a;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 5px 12px rgba(181, 31, 42, 0.20);
        }


        button:hover {

            background: #8f1620;

            transform: translateY(-1px);
        }


        /* -----------------------------------------
           Summary section
        ----------------------------------------- */

        .summary-section {

            margin-top: 35px;

            padding: 28px;

            border-radius: 14px;

            background: #f3f6fa;

            border-left: 5px solid #102a4c;

            border-top: 1px solid #d9dee7;

            border-right: 1px solid #d9dee7;

            border-bottom: 1px solid #d9dee7;
        }


        .summary-heading {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 18px;

            color: #102a4c;

            font-size: 20px;

            font-weight: bold;
        }


        .summary-text {

            color: #344258;

            font-size: 16px;

            line-height: 1.8;

            white-space: pre-wrap;
        }


        /* -----------------------------------------
           Footer
        ----------------------------------------- */

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #7a8492;

            font-size: 13px;
        }


        /* -----------------------------------------
           Responsive design
        ----------------------------------------- */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .container {

                padding: 28px 20px;

                border-radius: 15px;
            }


            h1 {

                font-size: 27px;
            }


            .upload-box {

                padding: 25px 15px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- ---------------------------------------
             Header
        ---------------------------------------- -->

        <div class="header">

            <div class="icon">
                📄
            </div>

            <h1>
                AI PDF Summarizer
            </h1>

            <p class="subtitle">
                Upload a PDF and let AI generate a concise
                summary of its contents.
            </p>

        </div>


        <!-- ---------------------------------------
             Upload form
        ---------------------------------------- -->

        <form
            method="POST"
            action="/summarize"
            enctype="multipart/form-data"
        >


            <div class="upload-box">

                <div class="upload-title">
                    Upload your PDF
                </div>


                <div class="upload-description">
                    Select a PDF document to generate an
                    AI-powered summary.
                </div>


                <input
                    type="file"
                    name="pdf"
                    accept=".pdf"
                    required
                >

            </div>


            <div class="button-container">

                <button type="submit">
                    ✨ Summarize PDF
                </button>

            </div>


        </form>


        <!-- ---------------------------------------
             Summary
        ---------------------------------------- -->

        {% if summary %}

        <div class="summary-section">

            <div class="summary-heading">

                <span>📝</span>

                <span>
                    Generated Summary
                </span>

            </div>


            <div class="summary-text">

                {{ summary }}

            </div>

        </div>

        {% endif %}


        <!-- ---------------------------------------
             Footer
        ---------------------------------------- -->

        <div class="footer">

            Powered by Flask, Hugging Face Transformers
            &amp; BART

        </div>


    </div>


</body>

</html>
